<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kushal Multi Speciality Hospital — Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/tables.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M26 14h12v12h12v12H38v12H26V38H14V26h12z' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      "use strict";
      const user = Auth.requireAuth();
      if (!user) return;
      Auth.renderShell(user, "operations.html");
      const content = document.getElementById("pageContent");
      content.insertAdjacentHTML("beforeend",
        '<div class="page-head fade-in-up"><div class="left"><div class="icon-pill" style="background:linear-gradient(135deg,#db2777,#be185d)"><i class="fa-solid fa-user-nurse"></i></div>' +
        '<div><div class="page-title">Operations / Surgeries</div><div class="page-sub" id="oCount">Loading…</div></div></div>' +
        '<div class="actions"><button class="btn btn-pink" id="newBtn"><i class="fa-solid fa-plus"></i> Schedule Surgery</button></div></div>' +
        '<div class="table-wrap fade-in-up"><div class="table-scroll"><table class="data"><thead><tr><th>ID</th><th>Patient</th><th>Lead Doctor</th><th>Department</th><th>Theatre</th><th>Date</th><th>Time</th><th>Type</th><th>Cost</th><th>Status</th><th>Actions</th></tr></thead><tbody id="tbody"></tbody></table></div></div>'
      );
      let patients = [], doctors = [];
      async function load() {
        const ops = await API.list("operations");
        document.getElementById("oCount").textContent = ops.length + " surgeries scheduled";
        const body = document.getElementById("tbody");
        if (!ops.length) body.innerHTML = '<tr><td colspan="11"><div class="empty-state"><i class="fa-solid fa-user-nurse"></i>No surgeries scheduled.</div></td></tr>';
        else body.innerHTML = ops.map((o) =>
          '<tr><td data-label="ID"><b>' + Utils.escapeHtml(o.id) + '</b></td><td data-label="Patient">' + Utils.escapeHtml(o.patient || "—") + '</td>' +
          '<td data-label="Lead Doctor">' + Utils.escapeHtml(o.leadDoctor || "—") + '</td><td data-label="Department">' + Utils.escapeHtml(o.department || "—") + '</td>' +
          '<td data-label="Theatre">' + Utils.escapeHtml(o.theatre || "—") + '</td><td data-label="Date">' + Utils.escapeHtml(Utils.fmtDate(o.date)) + '</td>' +
          '<td data-label="Time">' + Utils.escapeHtml((o.start || "") + "–" + (o.end || "")) + '</td><td data-label="Type">' + Utils.escapeHtml(o.type || "—") + '</td>' +
          '<td data-label="Cost">' + Utils.fmtMoney(o.cost) + '</td><td data-label="Status">' + Utils.statusBadge(o.status) + '</td>' +
          '<td data-label="Actions"><div class="row-actions"><button class="edit" data-id="' + Utils.escapeHtml(o.id) + '"><i class="fa-solid fa-pen"></i></button>' +
          '<button class="del" data-id="' + Utils.escapeHtml(o.id) + '"><i class="fa-solid fa-trash"></i></button></div></td></tr>'
        ).join("");
        body.querySelectorAll("[data-id]").forEach((b) => b.addEventListener("click", async () => {
          if (b.classList.contains("del")) { if (!confirm("Delete this surgery?")) return; await API.removeOne("operations", b.getAttribute("data-id")); Validation.toast("Surgery deleted", "success"); load(); }
          else openModal(b.getAttribute("data-id"));
        }));
      }
      document.getElementById("newBtn").addEventListener("click", () => openModal());
      async function openModal(id) {
        if (!patients.length) { patients = await API.list("patients"); doctors = await API.list("doctors"); }
        const o = id ? await API.getOne("operations", id) : {};
        const back = document.createElement("div"); back.className = "modal-backdrop";
        back.innerHTML = '<div class="modal"><div class="modal-head"><h3>' + (id ? "Edit Surgery" : "Schedule Surgery") + '</h3><button class="icon-btn" id="mClose"><i class="fa-solid fa-xmark"></i></button></div>' +
          '<div class="modal-body"><form><div class="form-grid">' +
          '<div class="field"><label>Patient <span class="req">*</span></label><select class="select" id="mPatient">' + patients.map((p) => '<option value="' + Utils.escapeHtml(p.firstName + " " + p.lastName) + '" data-id="' + Utils.escapeHtml(p.id) + '" data-dept="' + Utils.escapeHtml(p.department || "") + '">' + Utils.escapeHtml(p.firstName + " " + p.lastName) + '</option>').join("") + '</select></div>' +
          '<div class="field"><label>Lead Doctor <span class="req">*</span></label><select class="select" id="mDoctor">' + doctors.map((d) => '<option value="' + Utils.escapeHtml(d.name) + '" data-dept="' + Utils.escapeHtml(d.department || "") + '">' + Utils.escapeHtml(d.name) + '</option>').join("") + '</select></div>' +
          '<div class="field"><label>Department</label><input class="input" id="mDept" readonly></div>' +
          '<div class="field"><label>Operation Theatre</label><input class="input" id="mTheatre" placeholder="OT-1"></div>' +
          '<div class="field"><label>Date <span class="req">*</span></label><input class="input" type="date" id="mDate"></div>' +
          '<div class="field"><label>Start Time</label><input class="input" type="time" id="mStart"></div>' +
          '<div class="field"><label>End Time</label><input class="input" type="time" id="mEnd"></div>' +
          '<div class="field"><label>Surgery Type</label><input class="input" id="mType"></div>' +
          '<div class="field"><label>Cost (₹)</label><input class="input" type="number" id="mCost"></div>' +
          '<div class="field"><label>Status</label><select class="select" id="mStatus"><option>Scheduled</option><option>In Progress</option><option>Completed</option><option>Cancelled</option></select></div>' +
          '<div class="field" style="grid-column:1/-1"><label>Notes</label><textarea class="textarea" id="mNotes"></textarea></div>' +
          '</div></form></div><div class="modal-foot"><button class="btn btn-ghost" id="mCancel">Cancel</button><button class="btn btn-pink" id="mSave"><i class="fa-solid fa-floppy-disk"></i> Save</button></div></div>';
        document.body.appendChild(back);
        if (o) { document.getElementById("mPatient").value = o.patient; document.getElementById("mDoctor").value = o.leadDoctor; document.getElementById("mDept").value = o.department || ""; document.getElementById("mTheatre").value = o.theatre || ""; document.getElementById("mDate").value = (o.date || "").slice(0, 10); document.getElementById("mStart").value = o.start || ""; document.getElementById("mEnd").value = o.end || ""; document.getElementById("mType").value = o.type || ""; document.getElementById("mCost").value = o.cost || ""; document.getElementById("mStatus").value = o.status || "Scheduled"; document.getElementById("mNotes").value = o.notes || ""; }
        document.getElementById("mDoctor").addEventListener("change", function () { document.getElementById("mDept").value = this.options[this.selectedIndex].getAttribute("data-dept"); });
        const close = () => back.remove();
        document.getElementById("mClose").onclick = close; document.getElementById("mCancel").onclick = close;
        back.addEventListener("click", (e) => { if (e.target === back) close(); });
        document.getElementById("mSave").onclick = async () => {
          const sel = document.getElementById("mPatient");
          const data = { patient: sel.value, patientId: sel.options[sel.selectedIndex].getAttribute("data-id"), leadDoctor: document.getElementById("mDoctor").value, department: document.getElementById("mDept").value, theatre: document.getElementById("mTheatre").value, date: document.getElementById("mDate").value, start: document.getElementById("mStart").value, end: document.getElementById("mEnd").value, type: document.getElementById("mType").value, cost: document.getElementById("mCost").value, status: document.getElementById("mStatus").value, notes: document.getElementById("mNotes").value };
          if (!data.patient || !data.leadDoctor || !data.date) { Validation.toast("Patient, doctor and date are required", "error"); return; }
          if (id) await API.updateOne("operations", id, data);
          else await API.create("operations", Object.assign(data, { id: Utils.nextOpId(), createdAt: new Date().toISOString() }));
          Validation.toast("Surgery saved", "success"); close(); load();
        };
      }
      load();
    })();
  </script>
</body>
</html>
