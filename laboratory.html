<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kushal Multi Speciality Hospital — Laboratory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/tables.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M26 14h12v12h12v12H38v12H26V38H14V26h12z' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      "use strict";
      const user = Auth.requireAuth();
      if (!user) return;
      Auth.renderShell(user, "laboratory.html");
      const content = document.getElementById("pageContent");
      content.insertAdjacentHTML("beforeend",
        '<div class="page-head fade-in-up"><div class="left"><div class="icon-pill" style="background:linear-gradient(135deg,#ea580c,#c2410c)"><i class="fa-solid fa-flask-vial"></i></div>' +
        '<div><div class="page-title">Laboratory</div><div class="page-sub" id="lCount">Loading…</div></div></div>' +
        '<div class="actions"><button class="btn btn-orange" id="newBtn"><i class="fa-solid fa-plus"></i> Add Test</button></div></div>' +
        '<div class="table-wrap fade-in-up"><div class="table-scroll"><table class="data"><thead><tr><th>ID</th><th>Patient</th><th>Doctor</th><th>Test</th><th>Date</th><th>Report</th><th>Status</th><th>Actions</th></tr></thead><tbody id="tbody"></tbody></table></div></div>'
      );
      let patients = [], doctors = [];
      async function load() {
        const labs = await API.list("lab-tests");
        document.getElementById("lCount").textContent = labs.length + " lab tests";
        const body = document.getElementById("tbody");
        if (!labs.length) body.innerHTML = '<tr><td colspan="8"><div class="empty-state"><i class="fa-solid fa-flask-vial"></i>No lab tests.</div></td></tr>';
        else body.innerHTML = labs.map((l) =>
          '<tr><td data-label="ID"><b>' + Utils.escapeHtml(l.id) + '</b></td><td data-label="Patient">' + Utils.escapeHtml(l.patient || "—") + '</td>' +
          '<td data-label="Doctor">' + Utils.escapeHtml(l.doctor || "—") + '</td><td data-label="Test">' + Utils.escapeHtml(l.test || "—") + '</td>' +
          '<td data-label="Date">' + Utils.escapeHtml(Utils.fmtDate(l.date)) + '</td>' +
          '<td data-label="Report">' + (l.report ? '<a href="' + l.report + '" target="_blank" class="kpi-pill"><i class="fa-solid fa-file-lines"></i> View</a>' : '<span class="muted">—</span>') + '</td>' +
          '<td data-label="Status">' + Utils.statusBadge(l.status) + '</td>' +
          '<td data-label="Actions"><div class="row-actions"><button class="edit" data-id="' + Utils.escapeHtml(l.id) + '"><i class="fa-solid fa-pen"></i></button>' +
          '<button class="del" data-id="' + Utils.escapeHtml(l.id) + '"><i class="fa-solid fa-trash"></i></button></div></td></tr>'
        ).join("");
        body.querySelectorAll("[data-id]").forEach((b) => b.addEventListener("click", async () => {
          if (b.classList.contains("del")) { if (!confirm("Delete this test?")) return; await API.removeOne("lab-tests", b.getAttribute("data-id")); Validation.toast("Test deleted", "success"); load(); }
          else openModal(b.getAttribute("data-id"));
        }));
      }
      document.getElementById("newBtn").addEventListener("click", () => openModal());
      async function openModal(id) {
        if (!patients.length) { patients = await API.list("patients"); doctors = await API.list("doctors"); }
        const l = id ? await API.getOne("lab-tests", id) : {};
        const back = document.createElement("div"); back.className = "modal-backdrop";
        back.innerHTML = '<div class="modal"><div class="modal-head"><h3>' + (id ? "Edit Test" : "Add Lab Test") + '</h3><button class="icon-btn" id="mClose"><i class="fa-solid fa-xmark"></i></button></div>' +
          '<div class="modal-body"><form><div class="form-grid">' +
          '<div class="field"><label>Patient <span class="req">*</span></label><select class="select" id="mPatient">' + patients.map((p) => '<option value="' + Utils.escapeHtml(p.firstName + " " + p.lastName) + '" data-id="' + Utils.escapeHtml(p.id) + '">' + Utils.escapeHtml(p.firstName + " " + p.lastName) + '</option>').join("") + '</select></div>' +
          '<div class="field"><label>Doctor</label><select class="select" id="mDoctor">' + doctors.map((d) => '<option value="' + Utils.escapeHtml(d.name) + '">' + Utils.escapeHtml(d.name) + '</option>').join("") + '</select></div>' +
          '<div class="field"><label>Test <span class="req">*</span></label><select class="select" id="mTest">' + ["Blood Test","ECG","X-Ray","MRI","CT Scan","Ultrasound","Urine Test","Pathology","Other"].map((t) => '<option>' + t + '</option>').join("") + '</select></div>' +
          '<div class="field"><label>Date</label><input class="input" type="date" id="mDate" value="' + Utils.todayISO() + '"></div>' +
          '<div class="field"><label>Status</label><select class="select" id="mStatus"><option>Pending</option><option>In Progress</option><option>Completed</option></select></div>' +
          '<div class="field" style="grid-column:1/-1"><label>Upload Report</label><label class="file-drop"><input type="file" id="mFile" accept="image/*,application/pdf"><i class="fa-solid fa-cloud-arrow-up"></i><div>Click to upload report (PDF/Image)</div></label><div id="mPreview"></div></div>' +
          '</div></form></div><div class="modal-foot"><button class="btn btn-ghost" id="mCancel">Cancel</button><button class="btn btn-orange" id="mSave"><i class="fa-solid fa-floppy-disk"></i> Save</button></div></div>';
        document.body.appendChild(back);
        let reportUrl = l ? l.report || "" : "";
        if (l) { document.getElementById("mPatient").value = l.patient; document.getElementById("mDoctor").value = l.doctor || ""; document.getElementById("mTest").value = l.test || ""; document.getElementById("mDate").value = (l.date || "").slice(0, 10); document.getElementById("mStatus").value = l.status || "Pending"; if (reportUrl) document.getElementById("mPreview").innerHTML = '<a href="' + reportUrl + '" target="_blank" class="kpi-pill"><i class="fa-solid fa-file-lines"></i> Current report</a>'; }
        document.getElementById("mFile").addEventListener("change", async (e) => { const f = e.target.files[0]; if (!f) return; const err = Upload.validate(f); if (err) { Validation.toast(err, "error"); return; } reportUrl = await Utils.readFileAsDataURL(f); document.getElementById("mPreview").innerHTML = '<a href="' + reportUrl + '" target="_blank" class="kpi-pill"><i class="fa-solid fa-file-lines"></i> ' + Utils.escapeHtml(f.name) + '</a>'; });
        const close = () => back.remove();
        document.getElementById("mClose").onclick = close; document.getElementById("mCancel").onclick = close;
        back.addEventListener("click", (e) => { if (e.target === back) close(); });
        document.getElementById("mSave").onclick = async () => {
          const sel = document.getElementById("mPatient");
          const data = { patient: sel.value, patientId: sel.options[sel.selectedIndex].getAttribute("data-id"), doctor: document.getElementById("mDoctor").value, test: document.getElementById("mTest").value, date: document.getElementById("mDate").value, status: document.getElementById("mStatus").value, report: reportUrl };
          if (!data.patient || !data.test) { Validation.toast("Patient and test are required", "error"); return; }
          if (id) await API.updateOne("lab-tests", id, data);
          else await API.create("lab-tests", Object.assign(data, { id: Utils.nextLabId(), createdAt: new Date().toISOString() }));
          Validation.toast("Test saved", "success"); close(); load();
        };
      }
      load();
    })();
  </script>
</body>
</html>
