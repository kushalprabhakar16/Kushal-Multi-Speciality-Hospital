<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kushal Multi Speciality Hospital — Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M26 14h12v12h12v12H38v12H26V38H14V26h12z' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
    </div>
    <div class="auth-card" style="max-width:480px">
      <div class="auth-logo">
        <span id="authLogo"></span>
        <div>
          <div class="auth-title">KUSHAL</div>
          <div class="auth-sub" style="margin:0">Multi Speciality Hospital</div>
        </div>
      </div>
      <div class="auth-sub" style="margin-top:14px">Create a new account</div>

      <div class="auth-error" id="authError"></div>

      <form id="regForm" novalidate>
        <div class="auth-field">
          <label for="name">Full Name</label>
          <i class="fa-solid fa-user"></i>
          <input class="input" type="text" id="name" placeholder="Your full name" required />
        </div>
        <div class="auth-field">
          <label for="email">Email Address</label>
          <i class="fa-solid fa-envelope"></i>
          <input class="input" type="email" id="email" placeholder="you@kmsh.in" required />
        </div>
        <div class="auth-field">
          <label for="password">Password</label>
          <i class="fa-solid fa-lock"></i>
          <input class="input" type="password" id="password" placeholder="Min 6 characters" required />
          <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
        </div>
        <div class="auth-field">
          <label>Role</label>
          <div class="auth-roles" id="roleList"></div>
        </div>
        <button type="submit" class="auth-btn" id="regBtn">
          <span id="regBtnText">Create Account</span>
          <i class="fa-solid fa-user-plus"></i>
        </button>
      </form>
      <div class="auth-foot">
        Already have an account? <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      "use strict";
      document.getElementById("authLogo").innerHTML = Auth.logoSvg(48);
      const roles = ["Administrator", "Doctor", "Receptionist", "Nurse", "Lab Technician", "Pharmacist", "Patient"];
      const list = document.getElementById("roleList");
      roles.forEach((r, i) => {
        const lbl = document.createElement("label");
        lbl.className = "auth-role";
        lbl.innerHTML = '<input type="radio" name="role" value="' + r + '"' + (i === 0 ? " checked" : "") + "> " + r;
        list.appendChild(lbl);
      });

      const errBox = document.getElementById("authError");
      function showError(m) { errBox.textContent = m; errBox.style.display = "block"; }
      document.getElementById("togglePw").addEventListener("click", function () {
        const pw = document.getElementById("password");
        const i = this.querySelector("i");
        pw.type = pw.type === "password" ? "text" : "password";
        i.className = pw.type === "text" ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
      });

      document.getElementById("regForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        const body = {
          name: document.getElementById("name").value.trim(),
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value,
          role: document.querySelector("input[name=role]:checked").value,
        };
        const errs = Validation.validateUser(body);
        if (errs.length) { showError(errs[0]); return; }
        errBox.style.display = "none";
        const btn = document.getElementById("regBtn");
        btn.disabled = true;
        document.getElementById("regBtnText").textContent = "Creating…";
        try {
          const res = await API.register(body);
          Validation.toast("Account created. Welcome, " + res.user.name + "!", "success");
          setTimeout(() => { window.location.href = "dashboard.html"; }, 600);
        } catch (err) {
          showError(err.message || "Registration failed");
          btn.disabled = false;
          document.getElementById("regBtnText").textContent = "Create Account";
        }
      });
    })();
  </script>
</body>
</html>
