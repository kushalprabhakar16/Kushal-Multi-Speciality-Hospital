<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kushal Multi Speciality Hospital — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M26 14h12v12h12v12H38v12H26V38H14V26h12z' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      "use strict";
      const user = Auth.requireAuth();
      if (!user) return;
      Auth.renderShell(user, "profile.html");
      const content = document.getElementById("pageContent");
      content.insertAdjacentHTML("beforeend",
        '<div class="page-head fade-in-up"><div class="left"><div class="icon-pill"><i class="fa-solid fa-user"></i></div><div><div class="page-title">My Profile</div><div class="page-sub">Manage your account</div></div></div></div>' +
        '<div class="detail-header fade-in-up">' + Utils.avatarHtml(user.name, null, 92) +
        '<div><h2>' + Utils.escapeHtml(user.name) + '</h2><div class="meta-row"><span><i class="fa-solid fa-envelope"></i> ' + Utils.escapeHtml(user.email) + '</span><span><i class="fa-solid fa-id-badge"></i> ' + Utils.escapeHtml(user.role) + '</span></div></div></div>' +
        '<form class="form-card fade-in-up" style="max-width:640px"><div class="form-section"><h3>Account Details</h3><div class="form-grid">' +
        '<div class="field"><label>Full Name</label><input class="input" id="name" value="' + Utils.escapeHtml(user.name) + '"></div>' +
        '<div class="field"><label>Email</label><input class="input" id="email" value="' + Utils.escapeHtml(user.email) + '" readonly></div>' +
        '<div class="field"><label>Role</label><input class="input" value="' + Utils.escapeHtml(user.role) + '" readonly></div>' +
        '<div class="field"><label>Phone</label><input class="input" id="phone" placeholder="Add phone"></div>' +
        '</div></div><div class="form-section"><h3>Change Password</h3><div class="form-grid">' +
        '<div class="field"><label>New Password</label><input class="input" type="password" id="pw" placeholder="Leave blank to keep"></div>' +
        '<div class="field"><label>Confirm Password</label><input class="input" type="password" id="pw2"></div>' +
        '</div></div><div class="btn-row"><button type="button" class="btn" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i> Save Changes</button></div></form>'
      );
      document.getElementById("saveBtn").addEventListener("click", () => {
        const name = document.getElementById("name").value.trim();
        const pw = document.getElementById("pw").value;
        const pw2 = document.getElementById("pw2").value;
        if (!name) { Validation.toast("Name is required", "error"); return; }
        if (pw && pw !== pw2) { Validation.toast("Passwords do not match", "error"); return; }
        if (pw && pw.length < 6) { Validation.toast("Password must be at least 6 characters", "error"); return; }
        const updated = Object.assign({}, user, { name });
        localStorage.setItem(window.API_CONFIG.USER_KEY, JSON.stringify(updated));
        Validation.toast("Profile updated", "success");
        setTimeout(() => window.location.reload(), 600);
      });
    })();
  </script>
</body>
</html>
