<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kushal Multi Speciality Hospital — Departments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/tables.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M26 14h12v12h12v12H38v12H26V38H14V26h12z' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      "use strict";
      const user = Auth.requireAuth();
      if (!user) return;
      Auth.renderShell(user, "departments.html");
      const content = document.getElementById("pageContent");
      content.insertAdjacentHTML("beforeend",
        '<div class="page-head fade-in-up"><div class="left"><div class="icon-pill" style="background:linear-gradient(135deg,#0891b2,#0e7490)"><i class="fa-solid fa-building-circle-check"></i></div>' +
        '<div><div class="page-title">Departments</div><div class="page-sub" id="dCount">Loading…</div></div></div>' +
        '<div class="actions"><button class="btn btn-teal" id="newBtn"><i class="fa-solid fa-plus"></i> Add Department</button></div></div>' +
        '<div id="dGrid" class="grid-3 fade-in-up"></div>'
      );

      async function load() {
        const [depts, doctors, patients] = await Promise.all([API.list("departments"), API.list("doctors"), API.list("patients")]);
        document.getElementById("dCount").textContent = depts.length + " departments";
        const grid = document.getElementById("dGrid");
        if (!depts.length) { grid.innerHTML = '<div class="empty-state"><i class="fa-solid fa-building"></i>No departments.</div>'; return; }
        grid.innerHTML = depts.map((d) => {
          const docs = doctors.filter((x) => x.department === d.name).length;
          const pats = patients.filter((x) => x.department === d.name).length;
          const icons = { Cardiology: "fa-heart-pulse", Neurology: "fa-brain", "Neurosurgery": "fa-brain", Orthopaedics: "fa-bone", "General Medicine": "fa-stethoscope", "General Surgery": "fa-user-nurse", Pediatrics: "fa-baby", Neonatology: "fa-baby", "Obstetrics & Gynecology": "fa-venus", ENT: "fa-ear-listen", Ophthalmology: "fa-eye", Dermatology: "fa-hand-dots", Oncology: "fa-ribbon", Urology: "fa-droplet", Nephrology: "fa-kidneys", Gastroenterology: "fa-stomach", Pulmonology: "fa-lungs", Endocrinology: "fa-vial", Psychiatry: "fa-brain", Dental: "fa-tooth", Physiotherapy: "fa-person-walking", Radiology: "fa-x-ray", "Emergency Medicine": "fa-truck-medical", ICU: "fa-bed-pulse", NICU: "fa-baby", Laboratory: "fa-flask-vial", Pharmacy: "fa-prescription-bottle-medical" };
          const ic = icons[d.name] || "fa-hospital";
          return '<div class="card card-hover">' +
            '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><div class="icon-pill" style="width:42px;height:42px;background:linear-gradient(135deg,#0891b2,#0e7490)"><i class="fa-solid ' + ic + '"></i></div>' +
            '<div><b>' + Utils.escapeHtml(d.name) + '</b><div class="muted" style="font-size:0.78rem">' + Utils.escapeHtml(d.location || "") + '</div></div></div>' +
            '<div style="display:flex;gap:8px;margin-bottom:10px"><span class="kpi-pill"><i class="fa-solid fa-user-doctor"></i> ' + docs + ' doctors</span><span class="kpi-pill"><i class="fa-solid fa-user-injured"></i> ' + pats + ' patients</span></div>' +
            '<div class="muted" style="font-size:0.82rem">Head: ' + Utils.escapeHtml(d.head || "Not assigned") + '</div>' +
            '<div class="row-actions" style="margin-top:10px"><button class="edit" data-edit="' + Utils.escapeHtml(d.id) + '"><i class="fa-solid fa-pen"></i></button><button class="del" data-del="' + Utils.escapeHtml(d.id) + '"><i class="fa-solid fa-trash"></i></button></div>' +
            '</div>';
        }).join("");
        grid.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", () => openModal(b.getAttribute("data-edit"))));
        grid.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", async () => {
          if (!confirm("Delete this department?")) return;
          await API.removeOne("departments", b.getAttribute("data-del")); Validation.toast("Department deleted", "success"); load();
        }));
      }

      document.getElementById("newBtn").addEventListener("click", () => openModal());
      async function openModal(id) {
        const d = id ? await API.getOne("departments", id) : {};
        const back = document.createElement("div"); back.className = "modal-backdrop";
        back.innerHTML = '<div class="modal"><div class="modal-head"><h3>' + (id ? "Edit Department" : "Add Department") + '</h3><button class="icon-btn" id="mClose"><i class="fa-solid fa-xmark"></i></button></div>' +
          '<div class="modal-body"><form id="mForm"><div class="form-grid">' +
          '<div class="field"><label>Name <span class="req">*</span></label><input class="input" id="mName" required></div>' +
          '<div class="field"><label>Head / In-charge</label><input class="input" id="mHead"></div>' +
          '<div class="field"><label>Phone</label><input class="input" id="mPhone"></div>' +
          '<div class="field"><label>Location</label><input class="input" id="mLoc"></div>' +
          '<div class="field"><label>Status</label><select class="select" id="mStatus"><option>Active</option><option>Inactive</option></select></div>' +
          '</div></form></div><div class="modal-foot"><button class="btn btn-ghost" id="mCancel">Cancel</button><button class="btn btn-teal" id="mSave"><i class="fa-solid fa-floppy-disk"></i> Save</button></div></div>';
        document.body.appendChild(back);
        if (d) { document.getElementById("mName").value = d.name || ""; document.getElementById("mHead").value = d.head || ""; document.getElementById("mPhone").value = d.phone || ""; document.getElementById("mLoc").value = d.location || ""; document.getElementById("mStatus").value = d.status || "Active"; }
        const close = () => back.remove();
        document.getElementById("mClose").onclick = close; document.getElementById("mCancel").onclick = close;
        back.addEventListener("click", (e) => { if (e.target === back) close(); });
        document.getElementById("mSave").onclick = async () => {
          const name = document.getElementById("mName").value.trim();
          if (!name) { Validation.toast("Name is required", "error"); return; }
          const data = { name, head: document.getElementById("mHead").value.trim(), phone: document.getElementById("mPhone").value.trim(), location: document.getElementById("mLoc").value.trim(), status: document.getElementById("mStatus").value };
          if (id) await API.updateOne("departments", id, data);
          else await API.create("departments", Object.assign(data, { id: Utils.nextDeptId(), createdAt: new Date().toISOString() }));
          Validation.toast("Department saved", "success"); close(); load();
        };
      }
      load();
    })();
  </script>
</body>
</html>
