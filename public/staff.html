<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kushal Multi Speciality Hospital — Staff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/tables.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M26 14h12v12h12v12H38v12H26V38H14V26h12z' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      "use strict";
      const user = Auth.requireAuth();
      if (!user) return;
      Auth.renderShell(user, "staff.html");
      const content = document.getElementById("pageContent");
      content.insertAdjacentHTML("beforeend",
        '<div class="page-head fade-in-up"><div class="left"><div class="icon-pill" style="background:linear-gradient(135deg,#4f46e5,#4338ca)"><i class="fa-solid fa-users-gear"></i></div>' +
        '<div><div class="page-title">Staff</div><div class="page-sub" id="sCount">Loading…</div></div></div>' +
        '<div class="actions"><button class="btn" id="newBtn"><i class="fa-solid fa-plus"></i> Add Staff</button></div></div>' +
        '<div class="table-wrap fade-in-up"><div class="table-toolbar"><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input class="input" id="search" placeholder="Search name, role, department…"></div>' +
        '<select class="select" id="filterRole" style="max-width:200px"><option value="">All Roles</option><option>Administrator</option><option>Receptionist</option><option>Nurse</option><option>Lab Technician</option><option>Pharmacist</option><option>Accountant</option><option>Support Staff</option></select></div>' +
        '<div class="table-scroll"><table class="data"><thead><tr><th>Staff</th><th>Staff ID</th><th>Role</th><th>Department</th><th>Phone</th><th>Email</th><th>Joining</th><th>Status</th><th>Actions</th></tr></thead><tbody id="tbody"></tbody></table></div></div>'
      );
      let all = [];
      async function load() { all = await API.list("staff"); render(); }
      function filtered() {
        const q = document.getElementById("search").value.trim().toLowerCase();
        const r = document.getElementById("filterRole").value;
        let rows = all.slice();
        if (q) rows = rows.filter((s) => (s.name + " " + s.id + " " + s.role + " " + s.department).toLowerCase().includes(q));
        if (r) rows = rows.filter((s) => s.role === r);
        return rows;
      }
      function render() {
        const rows = filtered();
        document.getElementById("sCount").textContent = all.length + " staff members";
        const body = document.getElementById("tbody");
        if (!rows.length) body.innerHTML = '<tr><td colspan="9"><div class="empty-state"><i class="fa-solid fa-users-gear"></i>No staff found.</div></td></tr>';
        else body.innerHTML = rows.map((s) =>
          '<tr><td data-label="Staff"><div class="row-cell">' + Utils.avatarHtml(s.name, s.photo, 36) + '<div class="meta"><b>' + Utils.escapeHtml(s.name) + '</b></div></div></td>' +
          '<td data-label="Staff ID"><b>' + Utils.escapeHtml(s.id) + '</b></td><td data-label="Role">' + Utils.escapeHtml(s.role || "—") + '</td>' +
          '<td data-label="Department">' + Utils.escapeHtml(s.department || "—") + '</td><td data-label="Phone">' + Utils.escapeHtml(s.phone || "—") + '</td>' +
          '<td data-label="Email">' + Utils.escapeHtml(s.email || "—") + '</td><td data-label="Joining">' + Utils.escapeHtml(Utils.fmtDate(s.joining)) + '</td>' +
          '<td data-label="Status">' + Utils.statusBadge(s.status) + '</td>' +
          '<td data-label="Actions"><div class="row-actions"><button class="edit" data-id="' + Utils.escapeHtml(s.id) + '"><i class="fa-solid fa-pen"></i></button>' +
          '<button class="del" data-id="' + Utils.escapeHtml(s.id) + '"><i class="fa-solid fa-trash"></i></button></div></td></tr>'
        ).join("");
        body.querySelectorAll("[data-id]").forEach((b) => b.addEventListener("click", async () => {
          if (b.classList.contains("del")) { if (!confirm("Delete this staff member?")) return; await API.removeOne("staff", b.getAttribute("data-id")); Validation.toast("Staff deleted", "success"); load(); }
          else openModal(b.getAttribute("data-id"));
        }));
      }
      document.getElementById("search").addEventListener("input", Utils.debounce(render, 250));
      document.getElementById("filterRole").addEventListener("change", render);
      document.getElementById("newBtn").addEventListener("click", () => openModal());
      async function openModal(id) {
        const s = id ? await API.getOne("staff", id) : {};
        const back = document.createElement("div"); back.className = "modal-backdrop";
        back.innerHTML = '<div class="modal"><div class="modal-head"><h3>' + (id ? "Edit Staff" : "Add Staff") + '</h3><button class="icon-btn" id="mClose"><i class="fa-solid fa-xmark"></i></button></div>' +
          '<div class="modal-body"><form><div class="form-grid">' +
          '<div class="field"><label>Name <span class="req">*</span></label><input class="input" id="mName" required></div>' +
          '<div class="field"><label>Role <span class="req">*</span></label><select class="select" id="mRole"><option>Administrator</option><option>Receptionist</option><option>Nurse</option><option>Lab Technician</option><option>Pharmacist</option><option>Accountant</option><option>Support Staff</option></select></div>' +
          '<div class="field"><label>Department</label><input class="input" id="mDept"></div>' +
          '<div class="field"><label>Phone</label><input class="input" id="mPhone"></div>' +
          '<div class="field"><label>Email</label><input class="input" id="mEmail" type="email"></div>' +
          '<div class="field"><label>Joining Date</label><input class="input" type="date" id="mJoin" value="' + Utils.todayISO() + '"></div>' +
          '<div class="field"><label>Status</label><select class="select" id="mStatus"><option>Active</option><option>Inactive</option></select></div>' +
          '</div></form></div><div class="modal-foot"><button class="btn btn-ghost" id="mCancel">Cancel</button><button class="btn" id="mSave"><i class="fa-solid fa-floppy-disk"></i> Save</button></div></div>';
        document.body.appendChild(back);
        if (s) { document.getElementById("mName").value = s.name || ""; document.getElementById("mRole").value = s.role || "Nurse"; document.getElementById("mDept").value = s.department || ""; document.getElementById("mPhone").value = s.phone || ""; document.getElementById("mEmail").value = s.email || ""; document.getElementById("mJoin").value = (s.joining || "").slice(0, 10); document.getElementById("mStatus").value = s.status || "Active"; }
        const close = () => back.remove();
        document.getElementById("mClose").onclick = close; document.getElementById("mCancel").onclick = close;
        back.addEventListener("click", (e) => { if (e.target === back) close(); });
        document.getElementById("mSave").onclick = async () => {
          const data = { name: document.getElementById("mName").value.trim(), role: document.getElementById("mRole").value, department: document.getElementById("mDept").value.trim(), phone: document.getElementById("mPhone").value.trim(), email: document.getElementById("mEmail").value.trim(), joining: document.getElementById("mJoin").value, status: document.getElementById("mStatus").value };
          if (!data.name) { Validation.toast("Name is required", "error"); return; }
          if (id) await API.updateOne("staff", id, data);
          else await API.create("staff", Object.assign(data, { id: Utils.nextStaffId(), createdAt: new Date().toISOString() }));
          Validation.toast("Staff saved", "success"); close(); load();
        };
      }
      load();
    })();
  </script>
</body>
</html>
