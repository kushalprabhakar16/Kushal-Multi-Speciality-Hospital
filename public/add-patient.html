<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kushal Multi Speciality Hospital — Add Patient</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/tables.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M26 14h12v12h12v12H38v12H26V38H14V26h12z' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      "use strict";
      const user = Auth.requireAuth();
      if (!user) return;
      Auth.renderShell(user, "patients.html");

      const editId = Utils.getParam("id");
      const isEdit = !!editId;
      let photoData = "";

      const content = document.getElementById("pageContent");
      content.insertAdjacentHTML("beforeend",
        '<div class="page-head fade-in-up"><div class="left"><div class="icon-pill"><i class="fa-solid fa-user-plus"></i></div>' +
        '<div><div class="page-title">' + (isEdit ? "Edit Patient" : "Add Patient") + '</div><div class="page-sub">All fields marked <span style="color:var(--danger)">*</span> are required.</div></div></div>' +
        '<div class="actions"><a href="patients.html" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a></div></div>' +
        '<form id="pform" class="form-card fade-in-up">' +
        '<div class="form-section"><h3>Photo & Identity</h3>' +
        '<div class="form-grid">' +
        '<div class="field"><label>Patient Photo</label>' +
        '<label class="file-drop"><input type="file" id="photo" accept="image/*"><i class="fa-solid fa-camera"></i><div>Click to upload patient photo</div></label>' +
        '<div class="image-preview" id="photoPreview"></div></div>' +
        '<div class="field"><label>Patient ID <small class="muted">(auto-generated)</small></label><input class="input" id="id" readonly></div>' +
        '<div class="field"><label>First Name <span class="req">*</span></label><input class="input" id="firstName" required></div>' +
        '<div class="field"><label>Last Name <span class="req">*</span></label><input class="input" id="lastName" required></div>' +
        '<div class="field"><label>Gender <span class="req">*</span></label><select class="select" id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>' +
        '<div class="field"><label>Date of Birth <span class="req">*</span></label><input class="input" type="date" id="dob"></div>' +
        '<div class="field"><label>Age <small class="muted">(auto)</small></label><input class="input" id="age" readonly></div>' +
        '<div class="field"><label>Blood Group</label><select class="select" id="blood"><option value="">Select</option><option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>AB+</option><option>AB-</option><option>O+</option><option>O-</option></select></div>' +
        '<div class="field"><label>Height (cm)</label><input class="input" id="height" type="number"></div>' +
        '<div class="field"><label>Weight (kg)</label><input class="input" id="weight" type="number"></div>' +
        '</div></div>' +
        '<div class="form-section"><h3>Contact</h3><div class="form-grid">' +
        '<div class="field"><label>Phone <span class="req">*</span></label><input class="input" id="phone" required></div>' +
        '<div class="field"><label>Email</label><input class="input" id="email" type="email"></div>' +
        '<div class="field"><label>Address</label><input class="input" id="address"></div>' +
        '<div class="field"><label>City</label><input class="input" id="city"></div>' +
        '<div class="field"><label>Emergency Contact Name</label><input class="input" id="emergencyName"></div>' +
        '<div class="field"><label>Emergency Contact Number</label><input class="input" id="emergencyNumber"></div>' +
        '<div class="field"><label>Emergency Contact Relationship</label><input class="input" id="emergencyRelation"></div>' +
        '</div></div>' +
        '<div class="form-section"><h3>Medical</h3><div class="form-grid">' +
        '<div class="field"><label>Disease</label><input class="input" id="disease"></div>' +
        '<div class="field"><label>Diagnosis</label><input class="input" id="diagnosis"></div>' +
        '<div class="field"><label>Allergies</label><input class="input" id="allergies"></div>' +
        '<div class="field"><label>Medical History</label><input class="input" id="history"></div>' +
        '<div class="field"><label>Current Medications</label><input class="input" id="medications"></div>' +
        '<div class="field"><label>Insurance Provider</label><input class="input" id="insuranceProvider"></div>' +
        '<div class="field"><label>Insurance Number</label><input class="input" id="insuranceNumber"></div>' +
        '</div></div>' +
        '<div class="form-section"><h3>Admission</h3><div class="form-grid">' +
        '<div class="field"><label>Assigned Doctor</label><select class="select" id="doctor"></select></div>' +
        '<div class="field"><label>Department <span class="req">*</span></label><select class="select" id="department" required></select></div>' +
        '<div class="field"><label>Ward</label><input class="input" id="ward"></div>' +
        '<div class="field"><label>Bed Number</label><input class="input" id="bed"></div>' +
        '<div class="field"><label>Admission Date</label><input class="input" type="date" id="admissionDate" value="' + Utils.todayISO() + '"></div>' +
        '<div class="field"><label>Expected Discharge Date</label><input class="input" type="date" id="dischargeDate"></div>' +
        '<div class="field"><label>Patient Status <span class="req">*</span></label><select class="select" id="status" required><option>Admitted</option><option>Discharged</option><option>Emergency</option><option>Pending</option></select></div>' +
        '<div class="field" style="grid-column:1/-1"><label>Notes</label><textarea class="textarea" id="notes"></textarea></div>' +
        '</div></div>' +
        '<div class="btn-row" style="margin-top:8px">' +
        '<button type="submit" class="btn btn-lg" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i> ' + (isEdit ? "Update Patient" : "Save Patient") + '</button>' +
        '<a href="patients.html" class="btn btn-ghost btn-lg">Cancel</a>' +
        '</div></form>'
      );

      Upload.bind("photo", "photoPreview", (url) => { photoData = url || ""; });

      document.getElementById("dob").addEventListener("change", function () {
        document.getElementById("age").value = Utils.calcAge(this.value);
      });

      async function init() {
        const [doctors, depts] = await Promise.all([API.list("doctors"), API.list("departments")]);
        const dSel = document.getElementById("doctor");
        doctors.forEach((d) => { const o = document.createElement("option"); o.value = d.name; o.textContent = d.name + " (" + Utils.escapeHtml(d.spec || "") + ")"; dSel.appendChild(o); });
        const depSel = document.getElementById("department");
        depts.forEach((d) => { const o = document.createElement("option"); o.value = d.name; o.textContent = d.name; depSel.appendChild(o); });

        if (isEdit) {
          const p = await API.getOne("patients", editId);
          if (!p) { Validation.toast("Patient not found", "error"); setTimeout(() => window.location.href = "patients.html", 800); return; }
          ["id","firstName","lastName","gender","dob","blood","height","weight","phone","email","address","city","emergencyName","emergencyNumber","emergencyRelation","disease","diagnosis","allergies","history","medications","insuranceProvider","insuranceNumber","doctor","department","ward","bed","admissionDate","dischargeDate","status","notes"].forEach((k) => {
            const el = document.getElementById(k);
            if (el && p[k] != null) el.value = p[k];
          });
          document.getElementById("age").value = Utils.calcAge(p.dob);
          photoData = p.photo || "";
          if (photoData) document.getElementById("photoPreview").innerHTML = '<img src="' + photoData + '" /><button type="button" class="preview-remove"><i class="fa-solid fa-xmark"></i></button>';
          document.querySelector(".preview-remove")?.addEventListener("click", () => { photoData = ""; document.getElementById("photoPreview").innerHTML = ""; });
        } else {
          document.getElementById("id").value = Utils.nextPatientId();
        }
      }

      document.getElementById("pform").addEventListener("submit", async function (e) {
        e.preventDefault();
        const data = {
          id: document.getElementById("id").value,
          photo: photoData,
          firstName: document.getElementById("firstName").value.trim(),
          lastName: document.getElementById("lastName").value.trim(),
          gender: document.getElementById("gender").value,
          dob: document.getElementById("dob").value,
          blood: document.getElementById("blood").value,
          height: document.getElementById("height").value,
          weight: document.getElementById("weight").value,
          phone: document.getElementById("phone").value.trim(),
          email: document.getElementById("email").value.trim(),
          address: document.getElementById("address").value.trim(),
          city: document.getElementById("city").value.trim(),
          emergencyName: document.getElementById("emergencyName").value.trim(),
          emergencyNumber: document.getElementById("emergencyNumber").value.trim(),
          emergencyRelation: document.getElementById("emergencyRelation").value.trim(),
          disease: document.getElementById("disease").value.trim(),
          diagnosis: document.getElementById("diagnosis").value.trim(),
          allergies: document.getElementById("allergies").value.trim(),
          history: document.getElementById("history").value.trim(),
          medications: document.getElementById("medications").value.trim(),
          insuranceProvider: document.getElementById("insuranceProvider").value.trim(),
          insuranceNumber: document.getElementById("insuranceNumber").value.trim(),
          doctor: document.getElementById("doctor").value,
          department: document.getElementById("department").value,
          ward: document.getElementById("ward").value.trim(),
          bed: document.getElementById("bed").value.trim(),
          admissionDate: document.getElementById("admissionDate").value,
          dischargeDate: document.getElementById("dischargeDate").value,
          status: document.getElementById("status").value,
          notes: document.getElementById("notes").value.trim(),
        };
        const errs = Validation.validatePatient(data);
        if (errs.length) { Validation.toast(errs[0], "error"); return; }
        const btn = document.getElementById("saveBtn");
        btn.disabled = true;
        try {
          if (isEdit) {
            await API.updateOne("patients", editId, data);
            Validation.toast("Patient updated", "success");
          } else {
            await API.create("patients", Object.assign(data, { createdAt: new Date().toISOString() }));
            Storage.addNotification({ type: "patient", title: "New patient registered", message: data.firstName + " " + data.lastName + " (" + data.id + ")" });
            Validation.toast("Patient saved", "success");
          }
          setTimeout(() => { window.location.href = "patients.html"; }, 600);
        } catch (err) {
          Validation.toast(err.message || "Save failed", "error");
          btn.disabled = false;
        }
      });

      init();
    })();
  </script>
</body>
</html>
