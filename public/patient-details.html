<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kushal Multi Speciality Hospital — Patient Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/tables.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M26 14h12v12h12v12H38v12H26V38H14V26h12z' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/upload.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      "use strict";
      const user = Auth.requireAuth();
      if (!user) return;
      Auth.renderShell(user, "patients.html");
      const content = document.getElementById("pageContent");
      content.insertAdjacentHTML("beforeend", '<div id="pd" class="fade-in-up"></div>');
      const id = Utils.getParam("id");
      const host = document.getElementById("pd");

      async function load() {
        const p = await API.getOne("patients", id);
        if (!p) { host.innerHTML = '<div class="empty-state"><i class="fa-solid fa-user-xmark"></i>Patient not found.</div>'; return; }
        const fullName = p.firstName + " " + p.lastName;
        document.title = fullName + " — Kushal Multi Speciality Hospital";

        host.innerHTML =
          '<div class="page-head"><div class="left"><div class="icon-pill"><i class="fa-solid fa-id-card"></i></div><div><div class="page-title">Patient Profile</div><div class="page-sub">Complete medical record</div></div></div>' +
          '<div class="actions"><a href="patients.html" class="btn btn-ghost"><i class="fa-solid fa-arrow-left"></i> Back</a>' +
          '<a href="add-patient.html?id=' + encodeURIComponent(p.id) + '" class="btn btn-ghost"><i class="fa-solid fa-pen"></i> Edit</a>' +
          '<button class="btn btn-ghost" id="printBtn"><i class="fa-solid fa-print"></i> Print</button>' +
          '<button class="btn btn-red" id="delBtn"><i class="fa-solid fa-trash"></i> Delete</button></div></div>' +
          '<div class="detail-header">' + Utils.avatarHtml(fullName, p.photo, 92) +
          '<div><h2>' + Utils.escapeHtml(fullName) + '</h2><div class="meta-row"><span><i class="fa-solid fa-id-badge"></i> ' + Utils.escapeHtml(p.id) + '</span>' +
          '<span><i class="fa-solid fa-user-doctor"></i> ' + Utils.escapeHtml(p.doctor || "Unassigned") + '</span>' +
          '<span><i class="fa-solid fa-building"></i> ' + Utils.escapeHtml(p.department || "—") + '</span></div>' +
          '<div style="margin-top:8px">' + Utils.statusBadge(p.status) + '</div></div></div>' +
          '<div class="grid-2" style="margin-bottom:18px">' +
          '<div class="card"><h3 class="section-title">Personal Information</h3><div class="info-grid">' +
          info("Full Name", fullName) + info("Patient ID", p.id) + info("Age", Utils.calcAge(p.dob) || "—") +
          info("Gender", p.gender || "—") + info("Date of Birth", Utils.fmtDate(p.dob)) + info("Blood Group", p.blood || "—") +
          info("Height", p.height ? p.height + " cm" : "—") + info("Weight", p.weight ? p.weight + " kg" : "—") +
          info("Phone", p.phone || "—") + info("Email", p.email || "—") + info("Address", (p.address || "") + (p.city ? ", " + p.city : "") || "—") +
          info("Emergency Contact", (p.emergencyName || "—") + " (" + (p.emergencyRelation || "") + ")") + info("Emergency Number", p.emergencyNumber || "—") +
          '</div></div>' +
          '<div class="card"><h3 class="section-title">Medical Information</h3><div class="info-grid">' +
          info("Disease", p.disease || "—") + info("Diagnosis", p.diagnosis || "—") + info("Allergies", p.allergies || "None") +
          info("Medical History", p.history || "—") + info("Current Medications", p.medications || "—") +
          info("Insurance Provider", p.insuranceProvider || "—") + info("Insurance Number", p.insuranceNumber || "—") +
          info("Assigned Doctor", p.doctor || "—") + info("Department", p.department || "—") + info("Ward", p.ward || "—") +
          info("Bed Number", p.bed || "—") + info("Admission Date", Utils.fmtDate(p.admissionDate)) + info("Discharge Date", Utils.fmtDate(p.dischargeDate)) +
          info("Status", p.status || "—") + info("Notes", p.notes || "—") +
          '</div></div></div>' +
          '<div class="grid-2">' +
          '<div class="card"><h3 class="section-title">Medical Timeline</h3><div class="timeline">' +
          timeline("Registration", p.createdAt, true) +
          timeline("Admission", p.admissionDate, !!p.admissionDate) +
          timeline("Consultation", p.doctor ? "Assigned to " + p.doctor : null, !!p.doctor) +
          timeline("Diagnosis", p.diagnosis, !!p.diagnosis) +
          timeline("Medication", p.medications, !!p.medications) +
          timeline("Discharge", p.dischargeDate, !!p.dischargeDate) +
          '</div></div>' +
          '<div class="card"><h3 class="section-title">Documents</h3>' +
          '<label class="file-drop" style="margin-bottom:14px"><input type="file" id="docFile" accept="image/*,application/pdf"><i class="fa-solid fa-cloud-arrow-up"></i><div>Upload medical report, prescription, X-ray, MRI, CT…</div></label>' +
          '<div id="docList"></div></div></div>';

        document.getElementById("printBtn").addEventListener("click", () => Utils.printArea(host));
        document.getElementById("delBtn").addEventListener("click", async () => {
          if (!confirm("Delete this patient permanently?")) return;
          await API.removeOne("patients", p.id);
          Validation.toast("Patient deleted", "success");
          setTimeout(() => window.location.href = "patients.html", 600);
        });

        renderDocs(p);
        document.getElementById("docFile").addEventListener("change", async (e) => {
          const f = e.target.files[0]; if (!f) return;
          const err = Upload.validate(f);
          if (err) { Validation.toast(err, "error"); return; }
          const url = await Utils.readFileAsDataURL(f);
          const docs = p.documents ? p.documents.slice() : [];
          docs.push({ name: f.name, type: f.type, url, uploaded: new Date().toISOString() });
          await API.updateOne("patients", p.id, { documents: docs });
          Validation.toast("Document uploaded", "success");
          p.documents = docs; renderDocs(p);
        });
      }

      function info(k, v) { return '<div class="info-item"><div class="k">' + Utils.escapeHtml(k) + '</div><div class="v">' + Utils.escapeHtml(v == null ? "—" : String(v)) + '</div></div>'; }
      function timeline(title, date, done) {
        return '<div class="timeline-item' + (done ? " done" : "") + '"><div class="t-title">' + Utils.escapeHtml(title) + '</div><div class="t-time">' + (date ? Utils.escapeHtml(Utils.fmtDateTime(date)) : "Pending") + '</div></div>';
      }

      function renderDocs(p) {
        const list = document.getElementById("docList");
        const docs = p.documents || [];
        if (!docs.length) { list.innerHTML = '<div class="muted" style="padding:8px 0">No documents uploaded yet.</div>'; return; }
        list.innerHTML = docs.map((d, i) =>
          '<div class="list-row">' +
          (d.type && d.type.startsWith("image/") ? '<img src="' + d.url + '" style="width:40px;height:40px;border-radius:8px;object-fit:cover"/>' : '<div class="avatar avatar-text" style="width:40px;height:40px;background:var(--primary)"><i class="fa-solid fa-file-lines"></i></div>') +
          '<div class="lr-meta"><b>' + Utils.escapeHtml(d.name) + '</b><small>' + Utils.escapeHtml(Utils.fmtDate(d.uploaded)) + '</small></div>' +
          '<div class="row-actions"><a class="btn btn-sm btn-ghost" href="' + d.url + '" target="_blank" download="' + Utils.escapeHtml(d.name) + '"><i class="fa-solid fa-download"></i></a>' +
          '<button class="del" data-doc="' + i + '"><i class="fa-solid fa-trash"></i></button></div></div>'
        ).join("");
        list.querySelectorAll("[data-doc]").forEach((b) => b.addEventListener("click", async () => {
          if (!confirm("Remove this document?")) return;
          const docs = p.documents.slice();
          docs.splice(parseInt(b.getAttribute("data-doc"), 10), 1);
          await API.updateOne("patients", p.id, { documents: docs });
          p.documents = docs; renderDocs(p);
          Validation.toast("Document removed", "info");
        }));
      }

      load().catch((e) => Validation.toast("Could not load patient: " + e.message, "error"));
    })();
  </script>
</body>
</html>
