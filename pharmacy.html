<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kushal Multi Speciality Hospital — Pharmacy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <link rel="stylesheet" href="css/forms.css" />
  <link rel="stylesheet" href="css/tables.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M26 14h12v12h12v12H38v12H26V38H14V26h12z' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      "use strict";
      const user = Auth.requireAuth();
      if (!user) return;
      Auth.renderShell(user, "pharmacy.html");
      const content = document.getElementById("pageContent");
      content.insertAdjacentHTML("beforeend",
        '<div class="page-head fade-in-up"><div class="left"><div class="icon-pill" style="background:linear-gradient(135deg,#059669,#047857)"><i class="fa-solid fa-prescription-bottle-medical"></i></div>' +
        '<div><div class="page-title">Pharmacy</div><div class="page-sub" id="mCount">Loading…</div></div></div>' +
        '<div class="actions"><button class="btn btn-emerald" id="newBtn"><i class="fa-solid fa-plus"></i> Add Medicine</button></div></div>' +
        '<div class="stat-grid" id="pStats"></div>' +
        '<div class="table-wrap fade-in-up"><div class="table-toolbar"><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input class="input" id="search" placeholder="Search medicine, category, supplier…"></div>' +
        '<select class="select" id="filterStatus" style="max-width:180px"><option value="">All Stock</option><option>In Stock</option><option>Low Stock</option><option>Out of Stock</option><option>Expired</option></select></div>' +
        '<div class="table-scroll"><table class="data"><thead><tr><th>ID</th><th>Medicine</th><th>Category</th><th>Supplier</th><th>Batch</th><th>Qty</th><th>Price</th><th>Expiry</th><th>Status</th><th>Actions</th></tr></thead><tbody id="tbody"></tbody></table></div></div>'
      );
      let all = [];
      async function load() {
        all = await API.list("pharmacy");
        const low = all.filter((m) => Number(m.qty) > 0 && Number(m.qty) <= 50).length;
        const exp = all.filter((m) => m.expiry && new Date(m.expiry) < new Date()).length;
        const out = all.filter((m) => Number(m.qty) === 0).length;
        document.getElementById("mCount").textContent = all.length + " medicines in inventory";
        document.getElementById("pStats").innerHTML =
          stat("fa-prescription-bottle", "Total Medicines", all.length, "In inventory", "stat-emerald") +
          stat("fa-triangle-exclamation", "Low Stock", low, "Need reorder", "stat-orange") +
          stat("fa-circle-xmark", "Out of Stock", out, "Unavailable", "stat-red") +
          stat("fa-calendar-xmark", "Expired", exp, "Dispose safely", "stat-pink");
        render();
      }
      function statusOf(m) {
        if (m.expiry && new Date(m.expiry) < new Date()) return "Expired";
        if (Number(m.qty) === 0) return "Out of Stock";
        if (Number(m.qty) <= 50) return "Low Stock";
        return "In Stock";
      }
      function filtered() {
        const q = document.getElementById("search").value.trim().toLowerCase();
        const st = document.getElementById("filterStatus").value;
        let rows = all.slice();
        if (q) rows = rows.filter((m) => (m.name + " " + m.category + " " + m.supplier + " " + m.id).toLowerCase().includes(q));
        if (st) rows = rows.filter((m) => statusOf(m) === st);
        return rows;
      }
      function render() {
        const rows = filtered();
        const body = document.getElementById("tbody");
        if (!rows.length) body.innerHTML = '<tr><td colspan="10"><div class="empty-state"><i class="fa-solid fa-prescription-bottle-medical"></i>No medicines found.</div></td></tr>';
        else body.innerHTML = rows.map((m) => {
          const st = statusOf(m);
          return '<tr><td data-label="ID"><b>' + Utils.escapeHtml(m.id) + '</b></td><td data-label="Medicine">' + Utils.escapeHtml(m.name) + '</td>' +
            '<td data-label="Category">' + Utils.escapeHtml(m.category || "—") + '</td><td data-label="Supplier">' + Utils.escapeHtml(m.supplier || "—") + '</td>' +
            '<td data-label="Batch">' + Utils.escapeHtml(m.batch || "—") + '</td><td data-label="Qty">' + Utils.escapeHtml(m.qty || 0) + '</td>' +
            '<td data-label="Price">' + Utils.fmtMoney(m.price) + '</td><td data-label="Expiry">' + Utils.escapeHtml(Utils.fmtDate(m.expiry)) + '</td>' +
            '<td data-label="Status">' + Utils.statusBadge(st) + '</td>' +
            '<td data-label="Actions"><div class="row-actions"><button class="edit" data-id="' + Utils.escapeHtml(m.id) + '"><i class="fa-solid fa-pen"></i></button>' +
            '<button class="del" data-id="' + Utils.escapeHtml(m.id) + '"><i class="fa-solid fa-trash"></i></button></div></td></tr>';
        }).join("");
        body.querySelectorAll("[data-id]").forEach((b) => b.addEventListener("click", async () => {
          if (b.classList.contains("del")) { if (!confirm("Delete this medicine?")) return; await API.removeOne("pharmacy", b.getAttribute("data-id")); Validation.toast("Medicine deleted", "success"); load(); }
          else openModal(b.getAttribute("data-id"));
        }));
      }
      document.getElementById("search").addEventListener("input", Utils.debounce(render, 250));
      document.getElementById("filterStatus").addEventListener("change", render);
      document.getElementById("newBtn").addEventListener("click", () => openModal());
      function stat(icon, label, value, foot, cls) { return '<div class="stat-card ' + cls + '"><i class="fa-solid ' + icon + ' stat-icon"></i><div class="stat-label">' + label + '</div><div class="stat-value">' + value + '</div><div class="stat-foot">' + foot + '</div></div>'; }
      async function openModal(id) {
        const m = id ? await API.getOne("pharmacy", id) : {};
        const back = document.createElement("div"); back.className = "modal-backdrop";
        back.innerHTML = '<div class="modal"><div class="modal-head"><h3>' + (id ? "Edit Medicine" : "Add Medicine") + '</h3><button class="icon-btn" id="mClose"><i class="fa-solid fa-xmark"></i></button></div>' +
          '<div class="modal-body"><form><div class="form-grid">' +
          '<div class="field"><label>Name <span class="req">*</span></label><input class="input" id="mName" required></div>' +
          '<div class="field"><label>Category <span class="req">*</span></label><input class="input" id="mCat" list="catList" required><datalist id="catList">' + ["Analgesic","Antibiotic","Statin","Antidiabetic","Anti-emetic","Antacid","Antiseptic","Vitamin"].map((c) => '<option>' + c + '</option>').join("") + '</datalist></div>' +
          '<div class="field"><label>Supplier <span class="req">*</span></label><input class="input" id="mSup" required></div>' +
          '<div class="field"><label>Batch Number</label><input class="input" id="mBatch"></div>' +
          '<div class="field"><label>Quantity <span class="req">*</span></label><input class="input" type="number" id="mQty" required></div>' +
          '<div class="field"><label>Price (₹) <span class="req">*</span></label><input class="input" type="number" id="mPrice" required></div>' +
          '<div class="field"><label>Expiry Date <span class="req">*</span></label><input class="input" type="date" id="mExp" required></div>' +
          '</div></form></div><div class="modal-foot"><button class="btn btn-ghost" id="mCancel">Cancel</button><button class="btn btn-emerald" id="mSave"><i class="fa-solid fa-floppy-disk"></i> Save</button></div></div>';
        document.body.appendChild(back);
        if (m) { document.getElementById("mName").value = m.name || ""; document.getElementById("mCat").value = m.category || ""; document.getElementById("mSup").value = m.supplier || ""; document.getElementById("mBatch").value = m.batch || ""; document.getElementById("mQty").value = m.qty || ""; document.getElementById("mPrice").value = m.price || ""; document.getElementById("mExp").value = (m.expiry || "").slice(0, 10); }
        const close = () => back.remove();
        document.getElementById("mClose").onclick = close; document.getElementById("mCancel").onclick = close;
        back.addEventListener("click", (e) => { if (e.target === back) close(); });
        document.getElementById("mSave").onclick = async () => {
          const data = { name: document.getElementById("mName").value.trim(), category: document.getElementById("mCat").value.trim(), supplier: document.getElementById("mSup").value.trim(), batch: document.getElementById("mBatch").value.trim(), qty: document.getElementById("mQty").value, price: document.getElementById("mPrice").value, expiry: document.getElementById("mExp").value };
          const errs = Validation.validateMedicine(data);
          if (errs.length) { Validation.toast(errs[0], "error"); return; }
          if (id) await API.updateOne("pharmacy", id, data);
          else await API.create("pharmacy", Object.assign(data, { id: Utils.nextMedId(), createdAt: new Date().toISOString() }));
          Validation.toast("Medicine saved", "success"); close(); load();
        };
      }
      load();
    })();
  </script>
</body>
</html>
